                                                    #{item.id}
                                                </div>
                                                <div className="absolute inset-0 bg-slate-950/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                    <span className="bg-white/95 text-slate-900 text-xs font-bold px-3 py-1.5 rounded-xl shadow-lg flex items-center gap-1.5">
                                                        <ZoomIn className="w-3.5 h-3.5 text-emerald-600" /> Lihat Foto
                                                    </span>
                                                </div>
                                            </div>
                                            
                                            <div className="p-4 flex-1 flex flex-col justify-between bg-white">
                                                <div className="flex items-start gap-2">
                                                    <CheckCircle className="w-4 h-4 text-emerald-600 mt-0.5 flex-shrink-0" />
                                                    <p className="text-xs sm:text-sm font-semibold text-slate-700 leading-snug">{item.desc}</p>
                                                </div>
                                                <div className="mt-3 pt-3 border-t border-slate-100 flex justify-between items-center text-[11px] text-slate-400">
                                                    <span className="capitalize">{item.category.replace('tahap', 'Tahap ')}</span>
                                                    <span className="text-emerald-600 font-bold group-hover:underline">Perbesar →</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                            </div>

                        </div>
                    </section>

                    {/* OPERATIONAL GALLERY SECTION */}
                    <section id="gallery" className="py-20 bg-white border-b border-slate-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            
                            <div className="text-center max-w-3xl mx-auto mb-16">
                                <div className="inline-flex items-center gap-2 bg-emerald-100 text-emerald-800 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-wider mb-3">
                                    <ChickenIcon className="w-4 h-4 text-emerald-600" /> Kandang Aktif
                                </div>
                                <h2 className="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">Galeri Operasional Ternak</h2>
                                <p className="mt-3 text-base sm:text-lg text-slate-600">
                                    Dokumentasi nyata kegiatan operasional, sanitasi, dan panen broiler di TFARM Timika.
                                </p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                {operationsData.map((op, idx) => (
                                    <div 
                                        key={idx} 
                                        onClick={() => openLightbox(operationsData.map(x => ({ title: x.title, desc: x.desc, img: baseUrl + x.img })), idx)}
                                        className="relative rounded-3xl overflow-hidden shadow-lg group h-72 sm:h-96 cursor-pointer border border-slate-200 transform hover:-translate-y-1 transition duration-300"
                                    >
                                        <img 
                                            src={baseUrl + op.img} 
                                            alt={op.title} 
                                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 filter brightness-95" 
                                            loading="lazy" 
                                        />
                                        <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent flex flex-col justify-end p-6 sm:p-8">
                                            <span className="text-emerald-400 text-xs font-extrabold uppercase tracking-wider mb-1">Operasional Berjalan</span>
                                            <h3 className="text-white text-2xl font-black">{op.title}</h3>
                                            <p className="text-slate-300 mt-2 text-sm max-w-xl">{op.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>

                        </div>
                    </section>

                    {/* LOCATION & CONTACT SECTION */}
                    <section id="location" className="py-20 bg-emerald-950 text-white relative overflow-hidden">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                                
                                {/* Location Details */}
                                <div className="lg:col-span-6 space-y-6">
                                    <div className="inline-flex items-center gap-2 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">
                                        <MapPin className="w-4 h-4 text-emerald-400" /> Lokasi Strategis
                                    </div>
                                    
                                    <h2 className="text-3xl sm:text-4xl font-black tracking-tight leading-tight">
                                        Kunjungi Lokasi Peternakan TFARM Timika
                                    </h2>
                                    
                                    <p className="text-slate-300 text-base">
                                        Terletak di kawasan agrobisnis Timika, Papua, dengan akses jalan luas untuk armada pengiriman DOC, pakan, dan panen logistik ayam.
                                    </p>

                                    <div className="space-y-4 pt-2">
                                        <div className="flex items-start gap-4 bg-emerald-900/50 p-4 rounded-2xl border border-emerald-800">
                                            <div className="p-3 bg-emerald-800 rounded-xl text-emerald-300 flex-shrink-0">
                                                <MapPin className="w-6 h-6" />
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-white text-base">Alamat Peternakan</h4>
                                                <p className="text-slate-300 text-sm mt-0.5">Timika, Kabupaten Mimika, Provinsi Papua Tengah, Indonesia</p>
                                            </div>
                                        </div>

                                        <div className="flex items-start gap-4 bg-emerald-900/50 p-4 rounded-2xl border border-emerald-800">
                                            <div className="p-3 bg-emerald-800 rounded-xl text-emerald-300 flex-shrink-0">
                                                <Home className="w-6 h-6" />
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-white text-base">Fasilitas Tapak</h4>
                                                <p className="text-slate-300 text-sm mt-0.5">Kandang 2 Lantai (24x8m), Mess & Kantor (5x12m), Gudang Pakan, Ruang Genset & Tamu.</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Action Buttons */}
                                    <div className="flex flex-wrap gap-4 pt-4">
                                        <a 
                                            href={mapLink} 
                                            target="_blank" 
                                            rel="noopener noreferrer" 
                                            className="inline-flex items-center gap-2 bg-gradient-to-r from-emerald-400 to-teal-400 hover:from-emerald-300 hover:to-teal-300 text-slate-950 font-bold px-6 py-3.5 rounded-2xl text-sm shadow-xl transition transform hover:-translate-y-1"
                                        >
                                            <Compass className="w-5 h-5 text-slate-950" /> Buka di Google Maps <ExternalLink className="w-4 h-4" />
                                        </a>
                                        <button 
                                            onClick={copyAddress} 
                                            className="inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-bold px-5 py-3.5 rounded-2xl text-sm border border-slate-700 transition"
                                        >
                                            <CopyIcon className="w-4 h-4 text-emerald-400" /> Salin Alamat
                                        </button>
                                    </div>
                                </div>

                                {/* Google Maps Embed Card */}
                                <div className="lg:col-span-6">
                                    <div className="relative w-full h-80 sm:h-96 bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border-4 border-emerald-800/80 group">
                                        <iframe 
                                            title="TFARM Location Timika" 
                                            width="100%" 
                                            height="100%" 
                                            frameBorder="0" 
                                            scrolling="no" 
                                            marginHeight="0" 
                                            marginWidth="0" 
                                            src="https://maps.google.com/maps?q=Timika+Papua&t=k&z=12&ie=UTF8&iwloc=&output=embed" 
                                            className="w-full h-full filter brightness-90 contrast-105 group-hover:brightness-100 transition duration-300"
                                        ></iframe>
                                        
                                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none p-4">
                                            <div className="bg-slate-950/90 backdrop-blur-md p-5 rounded-2xl shadow-2xl text-center border border-emerald-500/40 pointer-events-auto transform scale-95 group-hover:scale-100 transition duration-300 max-w-xs">
                                                <p className="font-bold text-white text-sm mb-1">Titik Koordinat Timika</p>
                                                <p className="text-xs text-slate-300 mb-3">Klik tombol untuk panduan navigasi rute lengkap via aplikasi Maps</p>
                                                <a 
                                                    href={mapLink} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer" 
                                                    className="inline-block bg-emerald-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold hover:bg-emerald-400 shadow-md"
                                                >
                                                    Mulai Navigasi GPS
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>

                        </div>
                    </section>

                    {/* FOOTER */}
                    <footer className="bg-slate-950 text-white py-16 border-t border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-10 pb-12 border-b border-slate-800">
                                
                                {/* Brand Column */}
                                <div className="md:col-span-2 space-y-4">
                                    <div className="flex items-center space-x-3">
                                        <div className="bg-white p-1.5 rounded-2xl shadow">
                                            <img src={logoUrl} onError={(e) => { e.target.src = "https://raw.githubusercontent.com/rcwpt/tfarm/main/logo.png"; }} alt="Logo TFARM" className="h-8 w-8 object-contain" />
                                        </div>
                                        <span className="font-black text-2xl tracking-tight">TFARM TIMIKA</span>
                                    </div>
                                    <p className="text-slate-400 text-sm max-w-md leading-relaxed">
                                        Peternakan ayam broiler modern di Timika, Papua. Menerapkan teknologi Closed House 2 tingkat berstandar nasional untuk ketahanan pangan berkualitas tinggi.
                                    </p>
                                </div>

                                {/* Quick Links */}
                                <div>
                                    <h4 className="font-bold text-white text-sm mb-4 uppercase tracking-wider">Navigasi Halaman</h4>
                                    <ul className="space-y-2.5 text-sm text-slate-400">
                                        <li><a href="#dashboard" className="hover:text-emerald-400 transition">Dashboard Performa IP</a></li>
                                        <li><a href="#calculator" className="hover:text-emerald-400 transition">Kalkulator IP Broiler</a></li>
                                        <li><a href="#about" className="hover:text-emerald-400 transition">Fasilitas & Spesifikasi</a></li>
                                        <li><a href="#blueprint" className="hover:text-emerald-400 transition">Sketsa Teknis 7.000 Ekor</a></li>
                                        <li><a href="#construction" className="hover:text-emerald-400 transition">Jurnal Pembangunan (23 Tahap)</a></li>
                                        <li><a href="#gallery" className="hover:text-emerald-400 transition">Galeri Operasional</a></li>
                                    </ul>
                                </div>

                                {/* Blueprint Links */}
                                <div>
                                    <h4 className="font-bold text-white text-sm mb-4 uppercase tracking-wider">Cetak Biru Khusus</h4>
                                    <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                                        <p className="text-xs text-slate-300">
                                            Model kandang skala 12x50m (9.000 ekor) dengan ventilasi 8 exhaust fan:
                                        </p>
                                        <a href="9000.html" className="inline-flex items-center gap-1.5 text-xs font-bold text-amber-400 hover:text-amber-300">
                                            Buka Blueprint 9.000 Ekor →
                                        </a>
                                    </div>
                                </div>

                            </div>

                            <div className="mt-8 flex flex-col sm:flex-row justify-between items-center text-xs text-slate-500 gap-4">
                                <p>&copy; {new Date().getFullYear()} TFARM Timika. All rights reserved. Dikembangkan untuk efisiensi agrobisnis peternakan modern.</p>
                                <div className="flex items-center space-x-4">
                                    <a href="index.html" className="hover:text-slate-300 transition">Beranda</a>
                                    <a href="9000.html" className="hover:text-slate-300 transition">Blueprint 9000</a>
                                    <a href={mapLink} target="_blank" rel="noopener noreferrer" className="hover:text-slate-300 transition">Google Maps</a>
                                </div>
                            </div>

                        </div>
                    </footer>

                    {/* LIGHTBOX MODAL VIEWER */}
                    {lightbox.isOpen && lightbox.list.length > 0 && (
                        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-xl flex flex-col justify-between p-4 sm:p-8 animate-fadeIn">
                            
                            {/* Modal Header */}
                            <div className="flex justify-between items-center text-white pb-4 border-b border-slate-800">
                                <div>
                                    <h4 className="text-base sm:text-lg font-bold">{lightbox.list[lightbox.index]?.title || "Dokumentasi TFARM"}</h4>
                                    <p className="text-xs text-slate-400">Foto {lightbox.index + 1} dari {lightbox.list.length}</p>
                                </div>
                                <button 
                                    onClick={closeLightbox}
                                    className="p-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl transition"
                                    aria-label="Tutup"
                                >
                                    <X className="w-6 h-6" />
                                </button>
                            </div>

                            {/* Main Image View */}
                            <div className="relative flex-1 flex items-center justify-center my-4 overflow-hidden">
                                <img 
                                    src={lightbox.list[lightbox.index]?.img} 
                                    alt={lightbox.list[lightbox.index]?.desc || "TFARM Image"} 
                                    className="max-h-[70vh] max-w-full object-contain rounded-2xl shadow-2xl border border-slate-800"
                                />

                                {/* Navigation Arrows */}
                                {lightbox.list.length > 1 && (
                                    <>
                                        <button 
                                            onClick={prevLightbox} 
                                            className="absolute left-2 sm:left-6 p-3 bg-slate-900/80 hover:bg-slate-800 text-white rounded-2xl border border-slate-700 transition shadow-xl"
                                            aria-label="Sebelumnya"
                                        >
                                            <ChevronLeft className="w-6 h-6" />
                                        </button>
                                        <button 
                                            onClick={nextLightbox} 
                                            className="absolute right-2 sm:right-6 p-3 bg-slate-900/80 hover:bg-slate-800 text-white rounded-2xl border border-slate-700 transition shadow-xl"
                                            aria-label="Selanjutnya"
                                        >
                                            <ChevronRight className="w-6 h-6" />
                                        </button>
                                    </>
                                )}
                            </div>

                            {/* Caption Footer */}
                            <div className="text-center text-slate-300 text-xs sm:text-sm bg-slate-900/80 p-4 rounded-2xl border border-slate-800 max-w-2xl mx-auto">
                                <p>{lightbox.list[lightbox.index]?.desc}</p>
                            </div>

                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
